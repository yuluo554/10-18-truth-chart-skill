<!DOCTYPE html>

.findings { margin: 0; padding-left: 16px; }

.sev { font-weight: 700; margin-right: 8px; }
.severity-error .sev { color: #b91c1c; }

</head>
<body>
<div class="chartaudit">

<div class="chart" data-section="chart">
<svg viewBox="0 0 860 480" width="860" height="480" role="img" aria-label="合成示例：甲组产量均值"><line x1="64" y1="424" x2="836" y2="424" stroke="#d1d5db" stroke-width="1"/><text x="58" y="424" text-anchor="end" dominant-baseline="central" font-size="12" fill="#374151">0</text><line x1="64" y1="896/3" x2="836" y2="896/3" stroke="#d1d5db" stroke-width="1"/><text x="58" y="896/3" text-anchor="end" dominant-baseline="central" font-size="12" fill="#374151">5</text><line x1="64" y1="520/3" x2="836" y2="520/3" stroke="#d1d5db" stroke-width="1"/><text x="58" y="520/3" text-anchor="end" dominant-baseline="central" font-size="12" fill="#374151">10</text><line x1="64" y1="48" x2="836" y2="48" stroke="#d1d5db" stroke-width="1"/><text x="58" y="48" text-anchor="end" dominant-baseline="central" font-size="12" fill="#374151">15</text><line x1="64" y1="424" x2="836" y2="424" stroke="#374151" stroke-width="1"/><line x1="64" y1="48" x2="64" y2="424" stroke="#374151" stroke-width="1"/><text x="450" y="442" text-anchor="middle" font-size="12" fill="#374151">甲组</text><rect x="426" y="8488/75" width="48" height="23312/75" fill="#2563eb" data-rid="7e3866d779cd57c5" tabindex="0"/><text x="450" y="8038/75" text-anchor="middle" font-size="12" fill="#111827">12.4</text></svg>

<script type="application/json" id="chartaudit-provenance" data-section="provenance-data">{"records":{"7e3866d779cd57c5":{"rendered_value_id":"7e3866d779cd57c5","csv_line":2,"column":"产量","raw_cell":"11","parsed_value":"11","transform_chain":[{"op":"filter","field":"组别","equals":"甲组"},{"op":"group_mean","field":"产量"}],"transform_summary":"filter(equals=甲组, field=组别) → group_mean(field=产量)","rendered_label":"12.4","exact_value":"12.4","series":null,"category":"甲组","sources":[{"csv_line":2,"column":"产量","raw_cell":"11"},{"csv_line":3,"column":"产量","raw_cell":"12"},{"csv_line":4,"column":"产量","raw_cell":"14"},{"csv_line":5,"column":"产量","raw_cell":"11"},{"csv_line":6,"column":"产量","raw_cell":"14"}],"sources_count":5}},"boxes":{}}</script>
<script>(function () {
  var payloadNode = document.getElementById('chartaudit-provenance');
  var tip = document.getElementById('chartaudit-tip');
  if (!payloadNode || !tip) { return; }
  var payload = JSON.parse(payloadNode.textContent);
  var config = {"cursor_offset":12};

  function makeLine(text) {
    var node = document.createElement('div');
    node.textContent = text;
    return node;
  }

  function clearTip() {
    while (tip.firstChild) { tip.removeChild(tip.firstChild); }
  }

  function positionTip(node, event) {
    var x = null;
    var y = null;
    if (event && typeof event.clientX === 'number') {
      x = event.clientX;
      y = event.clientY;
    } else {
      var rect = node.getBoundingClientRect();
      x = rect.left;
      y = rect.bottom;
    }
    tip.style.left = (x + config.cursor_offset) + 'px';
    tip.style.top = (y + config.cursor_offset) + 'px';
  }

  function showTip(node, event) {
    var record = payload.records[node.getAttribute('data-rid')];
    if (!record) { return; }
    clearTip();
    var sourceIndex = node.getAttribute('data-source');
    var csvLine = record.csv_line;
    var column = record.column;
    var rawCell = record.raw_cell;
    var extra = '';
    if (sourceIndex !== null) {
      var source = record.sources[parseInt(sourceIndex, 10)];
      if (source) {
        csvLine = source.csv_line;
        column = source.column;
        rawCell = source.raw_cell;
        extra = '（聚合记录 ' + record.rendered_value_id + ' 的第 ' + (parseInt(sourceIndex, 10) + 1) + ' 个源单元格）';
      }
    }
    tip.appendChild(makeLine('此值 ' + record.rendered_label + ' 来自第 ' + csvLine + ' 行「' + column + '」列' + extra));
    tip.appendChild(makeLine('原始单元格：' + rawCell));
    if (record.sources_count > 1) {
      var lines = [];
      for (var i = 0; i < record.sources.length; i += 1) {
        lines.push(record.sources[i].csv_line);
      }
      tip.appendChild(makeLine('聚合源：' + record.sources_count + ' 个单元格（第 ' + lines.join('、') + ' 行）'));
    }
    tip.appendChild(makeLine('变换链：' + record.transform_summary));
    tip.appendChild(makeLine('rendered_value_id：' + record.rendered_value_id));
    tip.style.display = 'block';
    positionTip(node, event);
  }

  function showBox(node, event) {
    var box = payload.boxes[node.getAttribute('data-box')];
    if (!box) { return; }
    clearTip();
    tip.appendChild(makeLine('箱线：' + box.category + '（' + box.n + ' 条逐观测记录）'));
    tip.appendChild(makeLine('min=' + box.min + ' ｜ q1=' + box.q1 + ' ｜ median=' + box.median + ' ｜ q3=' + box.q3 + ' ｜ max=' + box.max));
    tip.appendChild(makeLine('记录：' + box.record_ids.join('、')));
    tip.style.display = 'block';
    positionTip(node, event);
  }

  function hideTip() {
    tip.style.display = 'none';
  }

  function bind(node, show) {
    node.addEventListener('mouseenter', function (event) { show(node, event); });
    node.addEventListener('mousemove', function (event) { positionTip(node, event); });
    node.addEventListener('mouseleave', hideTip);
    node.addEventListener('focus', function (event) { show(node, event); });
    node.addEventListener('blur', hideTip);
  }

  var nodes = document.querySelectorAll('[data-rid]');
  for (var index = 0; index < nodes.length; index += 1) {
    bind(nodes[index], showTip);
  }
  var boxes = document.querySelectorAll('[data-box]');
  for (var boxIndex = 0; boxIndex < boxes.length; boxIndex += 1) {
    bind(boxes[boxIndex], showBox);
  }
}());</script>
</div>
</body>
</html>
