name: ci

on: [push, pull_request, workflow_dispatch]

env:
  PYTHONUTF8: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: CLI smoke (module form)
        run: python -m chartaudit.cli selftest
      - name: CLI smoke (console-script form)
        run: chartaudit selftest
